<!DOCTYPE html>
<html>
<head>
  <title>My Happy Virtual Pet</title>
  <!-- This line brings in our beautiful colors -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- The main title of our page -->
  <h1>My Happy Virtual Pet</h1>
  
  <!-- A picture of a puppy! We use the <img> tag for pictures -->
  <p id="pet-picture">🐶</p>

  <!-- This paragraph shows how the puppy feels right now -->
  <p id="pet-status">The puppy is awake and waiting for you!</p>

  <!-- Here are our two action buttons with their special nametags -->
  <button id="feed-button">Feed the Puppy</button>
  <button id="play-button">Play Fetch</button>

  <!-- This line brings in the electricity to make the buttons work -->
  <script src="scripts.js"></script>

</body>
</html>
